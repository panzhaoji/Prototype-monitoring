<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Offline - HORMUZ WATCH</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .icon {
            width: 80px;
            height: 80px;
            background: rgba(255, 69, 58, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            font-size: 40px;
        }
        h1 { font-size: 24px; margin-bottom: 12px; }
        p { color: #8E8E93; font-size: 16px; line-height: 1.5; margin-bottom: 32px; }
        .btn {
            background: #0A84FF;
            color: white;
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 17px;
        }
        .cached {
            margin-top: 32px;
            padding: 16px;
            background: rgba(48, 209, 88, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(48, 209, 88, 0.3);
        }
        .cached-title {
            color: #30D158;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .cached-list {
            color: #8E8E93;
            font-size: 14px;
            list-style: none;
        }
        .cached-list li { margin: 4px 0; }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>HORMUZ WATCH requires an internet connection for live AIS data. Check your connection and try again.</p>
    <a href="/" class="btn">Try Again</a>
    
    <div class="cached">
        <div class="cached-title">✓ Cached Data Available</div>
        <ul class="cached-list">
            <li>• Last vessel positions</li>
            <li>• Military asset locations</li>
            <li>• Strategic zone maps</li>
            <li>• Historical transit data</li>
        </ul>
    </div>
</body>
</html>
